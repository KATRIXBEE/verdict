<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="400" height="400" fill="#111111"/>
  
  <!-- Subtle grid lines for depth -->
  <line x1="0" y1="200" x2="400" y2="200" 
        stroke="#1A1A1A" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="400" 
        stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Person silhouette - head -->
  <circle cx="200" cy="148" r="68" fill="#2A2A2A"/>
  
  <!-- Neck -->
  <rect x="178" y="208" width="44" height="30" 
        rx="6" fill="#2A2A2A"/>
  
  <!-- Shoulders / body -->
  <ellipse cx="200" cy="320" rx="115" ry="90" fill="#2A2A2A"/>
  
  <!-- Suit collar details -->
  <polygon points="200,238 175,290 200,270" fill="#1E1E1E"/>
  <polygon points="200,238 225,290 200,270" fill="#1E1E1E"/>
  
  <!-- Red accent strip at bottom -->
  <rect x="0" y="385" width="400" height="15" fill="#FF4545" opacity="0.8"/>
  
  <!-- VERDICT watermark -->
  <text
    x="200" y="370"
    font-family="'Courier New', monospace"
    font-size="10"
    font-weight="bold"
    fill="#333333"
    text-anchor="middle"
    letter-spacing="4">
    PHOTO UNAVAILABLE
  </text>
  
  <!-- Small scales of justice icon at top right -->
  <text
    x="372" y="28"
    font-family="Arial"
    font-size="18"
    fill="#FF4545"
    opacity="0.5">
    ⚖
  </text>
</svg>
