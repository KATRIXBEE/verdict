<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F3EF"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Top red bar -->
  <rect width="1200" height="12" fill="#FF4336"/>
  
  <!-- Left black panel -->
  <rect x="0" y="12" width="420" height="618" fill="#111111"/>
  
  <!-- VERDICT logo block -->
  <rect x="32" y="60" width="64" height="64" fill="#FF4336"/>
  <text x="64" y="103" font-family="Georgia, serif" font-size="40" font-weight="900" fill="white" text-anchor="middle">⚖</text>
  
  <!-- VERDICT wordmark -->
  <text x="32" y="190" font-family="Georgia, serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">VERDICT</text>
  
  <!-- Tagline -->
  <text x="32" y="230" font-family="monospace" font-size="14" fill="#AAAAAA" font-weight="700" letter-spacing="2">CIVIC-TECH TRANSPARENCY</text>
  
  <!-- Divider -->
  <rect x="32" y="255" width="356" height="3" fill="#FF4336"/>
  
  <!-- Stats -->
  <text x="32" y="305" font-family="monospace" font-size="13" fill="#FFFFFF" font-weight="700">▸ 543 MPs PROFILED</text>
  <text x="32" y="335" font-family="monospace" font-size="13" fill="#FFFFFF" font-weight="700">▸ 1,420+ COURT CASES TRACKED</text>
  <text x="32" y="365" font-family="monospace" font-size="13" fill="#FFFFFF" font-weight="700">▸ ECI · eCOURTS · SANSAD · CAG</text>
  <text x="32" y="395" font-family="monospace" font-size="13" fill="#FFFFFF" font-weight="700">▸ VERDICT SCORE: 0.0 – 10.0</text>
  
  <!-- Bottom URL -->
  <text x="32" y="570" font-family="monospace" font-size="12" fill="#FF4336" font-weight="700">verdict.vercel.app</text>
  
  <!-- Right side content -->
  <!-- Main headline -->
  <text x="460" y="120" font-family="Georgia, serif" font-size="52" font-weight="900" fill="#111111">INDIA'S POLITICIAN</text>
  <text x="460" y="180" font-family="Georgia, serif" font-size="52" font-weight="900" fill="#111111">ACCOUNTABILITY</text>
  
  <!-- Highlighted word -->
  <rect x="460" y="198" width="308" height="64" fill="#FFD028"/>
  <rect x="460" y="198" width="308" height="64" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="476" y="244" font-family="Georgia, serif" font-size="52" font-weight="900" fill="#111111">PLATFORM</text>
  
  <!-- Sub-description -->
  <text x="460" y="305" font-family="monospace" font-size="16" fill="#555555" font-weight="600">Rate your Neta. Track your Tax Money.</text>
  <text x="460" y="330" font-family="monospace" font-size="16" fill="#555555" font-weight="600">Know your India. Built on verified data.</text>
  
  <!-- Three metric cards -->
  <rect x="460" y="380" width="215" height="110" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="460" y="380" width="215" height="4" fill="#00FF66"/>
  <text x="475" y="415" font-family="monospace" font-size="11" fill="#666666" font-weight="700">INDEXED MPs</text>
  <text x="475" y="460" font-family="Georgia, serif" font-size="42" font-weight="900" fill="#111111">543</text>
  
  <rect x="695" y="380" width="215" height="110" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="695" y="380" width="215" height="4" fill="#FF4336"/>
  <text x="710" y="415" font-family="monospace" font-size="11" fill="#666666" font-weight="700">COURT CASES</text>
  <text x="710" y="460" font-family="Georgia, serif" font-size="42" font-weight="900" fill="#111111">1,420+</text>
  
  <rect x="930" y="380" width="215" height="110" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="930" y="380" width="215" height="4" fill="#70D6FF"/>
  <text x="945" y="415" font-family="monospace" font-size="11" fill="#666666" font-weight="700">VERIFIED SOURCES</text>
  <text x="945" y="460" font-family="Georgia, serif" font-size="42" font-weight="900" fill="#111111">4</text>
  
  <!-- SIH Badge -->
  <rect x="460" y="520" width="200" height="36" fill="#111111"/>
  <text x="470" y="544" font-family="monospace" font-size="12" fill="#FFD028" font-weight="800">SIH 2026 PROJECT</text>
  
  <!-- Bottom border -->
  <rect x="0" y="618" width="1200" height="12" fill="#111111"/>
</svg>
